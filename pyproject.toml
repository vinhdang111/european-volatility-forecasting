[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "european-volatility-forecasting"
version = "0.1.0"
description = "Benchmarking econometric, machine learning and deep learning models for European equity volatility forecasting"
authors = [{ name = "Thanh Vinh Dang" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
